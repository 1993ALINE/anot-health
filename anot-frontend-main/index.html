<!doctype html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; img-src 'self' data: blob:; connect-src 'self' https://app.anot.health https://api.anot.health https://d3t0m4s0ayca85.cloudfront.net https://anot-backend-prod.eba-m2bjp2gp.ap-southeast-1.elasticbeanstalk.com; font-src 'self' https://fonts.gstatic.com; media-src 'self' blob:; base-uri 'self'; form-action 'self'; object-src 'none'; frame-src 'none'" />
    <meta http-equiv="Strict-Transport-Security" content="max-age=31536000; includeSubDomains" />
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/brand/anot-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#166AF4" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/splash.css" />
    <title>Anot.Health · Medical Scribing | Billing | Coding</title>
    <!-- Critical splash: shows before Vite/React bundle loads. #root stays hidden until splash is gone so the fade never reveals a second logo underneath. -->
  </head>
  <body>
    <div id="anot-splash" class="anot-splash" aria-busy="true" aria-label="Loading">
      <div class="anot-splash__logo-wrap">
        <span class="anot-splash__ring" aria-hidden="true"></span>
        <img
          class="anot-splash__logo"
          src="/brand/anot-logo.png"
          alt=""
          width="120"
          height="120"
          decoding="async"
          fetchpriority="high"
        />
      </div>
      <p class="anot-splash__label">Anot</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
