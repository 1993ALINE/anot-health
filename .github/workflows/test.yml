name: Test

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: anot-backend-main/anot-backend-main
    env:
      NODE_ENV: test
      JWT_SECRET: ci-test-jwt-secret-minimum-32-characters-long
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: anot-backend-main/anot-backend-main/package-lock.json
      - run: npm ci
      - run: npm test --if-present

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: anot-frontend-main/anot-frontend-main
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: anot-frontend-main/anot-frontend-main/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm test --if-present
      - name: Production build (validates VITE_API_URL)
        env:
          VITE_API_URL: https://app.anot.health/api
        run: npm run build
