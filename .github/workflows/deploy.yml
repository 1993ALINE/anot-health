# Automated tests on every push to main. Backend production deploy is manual:
#   cd anot-backend-main\anot-backend-main
#   powershell -File scripts\deploy-to-eb.ps1
# See docs/CI_CD_PIPELINE.md and docs/DEPLOYMENT_RUNBOOK.md

name: Deploy

on:
  push:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: anot-backend-main/anot-backend-main
    env:
      NODE_ENV: test
      JWT_SECRET: ci-test-jwt-secret-minimum-32-characters-long
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          check-latest: true
          cache: 'npm'
          cache-dependency-path: anot-backend-main/anot-backend-main/package-lock.json
      - run: npm ci
      - run: npm test

  # deploy-backend disabled — use manual deploy to avoid AWS OIDC / EB automation issues.
  # Manual backend deploy: powershell scripts/deploy-to-eb.ps1
  # (from anot-backend-main/anot-backend-main)

  deploy-frontend:
    name: deploy-frontend
    runs-on: ubuntu-22.04
    needs: [test]
    if: github.ref == 'refs/heads/main'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          check-latest: true
          cache: 'npm'
          cache-dependency-path: anot-frontend-main/anot-frontend-main/package-lock.json
      - name: Build frontend
        working-directory: anot-frontend-main/anot-frontend-main
        env:
          VITE_API_URL: https://app.anot.health/api
        run: |
          npm ci
          npm run build
      - name: Deployment note
        run: |
          echo "Frontend build succeeded. Upload dist/ to S3/CloudFront or connect Vercel for static hosting."
