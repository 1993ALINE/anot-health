name: Deploy

on:
  push:
    branches: [main]

# Defaults match production Elastic Beanstalk (override via GitHub secrets/vars if needed).
env:
  AWS_REGION: ap-southeast-1
  AWS_EB_APPLICATION: anot-backend
  AWS_EB_ENVIRONMENT: anot-backend-prod
  S3_BUCKET: elasticbeanstalk-ap-southeast-1-625242092266
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::625242092266:role/GitHubActionsRole
  API_HEALTH_URL: https://app.anot.health/api/health

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: anot-backend-main/anot-backend-main
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: anot-backend-main/anot-backend-main/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  deploy-backend:
    name: deploy-backend
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main'
    environment: production
    permissions:
      id-token: write
      contents: read
      actions: read
    defaults:
      run:
        working-directory: anot-backend-main/anot-backend-main
    env:
      AWS_REGION: ${{ vars.AWS_REGION || env.AWS_REGION }}
      EB_APP_NAME: ${{ vars.AWS_EB_APPLICATION || secrets.AWS_EB_APPLICATION || env.AWS_EB_APPLICATION }}
      EB_ENV_NAME: ${{ vars.AWS_EB_ENVIRONMENT || secrets.AWS_EB_ENVIRONMENT || env.AWS_EB_ENVIRONMENT }}
      DEPLOY_BUCKET: ${{ vars.S3_BUCKET || secrets.S3_BUCKET || env.S3_BUCKET }}
      DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN || env.AWS_DEPLOY_ROLE_ARN }}
      API_HEALTH_URL: ${{ vars.API_HEALTH_URL || env.API_HEALTH_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Node 22
        run: node --version | grep -E '^v22\.'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve deployment version label
        id: version
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          LABEL="ci-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          echo "label=${LABEL}" >> "$GITHUB_OUTPUT"
          echo "Version label: ${LABEL}"

      - name: Create deployment bundle
        id: bundle
        run: |
          # Match scripts/deploy-to-eb.ps1: tar zip with forward-slash paths, no node_modules
          # (EB runs npm install on the instance).
          BUNDLE_NAME="anot-backend-${{ steps.version.outputs.label }}.zip"
          BUNDLE_PATH="${RUNNER_TEMP}/${BUNDLE_NAME}"
          tar -a -c -f "${BUNDLE_PATH}" \
            --exclude node_modules \
            --exclude .git \
            --exclude dist \
            --exclude coverage \
            --exclude .env \
            --exclude .env.local \
            --exclude src/uploads \
            --exclude '*.webm' \
            --exclude '*.zip' \
            --exclude '*.tar.gz' \
            --exclude backup-* \
            --exclude artifacts \
            .
          echo "bundle_path=${BUNDLE_PATH}" >> "$GITHUB_OUTPUT"
          echo "bundle_name=${BUNDLE_NAME}" >> "$GITHUB_OUTPUT"
          ls -lh "${BUNDLE_PATH}"

      - name: Upload bundle to S3
        run: |
          aws s3 cp "${{ steps.bundle.outputs.bundle_path }}" \
            "s3://${DEPLOY_BUCKET}/${{ steps.bundle.outputs.bundle_name }}"

      - name: Create Elastic Beanstalk application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name "${EB_APP_NAME}" \
            --version-label "${{ steps.version.outputs.label }}" \
            --source-bundle "S3Bucket=${DEPLOY_BUCKET},S3Key=${{ steps.bundle.outputs.bundle_name }}" \
            --description "GitHub Actions deploy ${GITHUB_SHA}"

      - name: Update Elastic Beanstalk environment
        run: |
          aws elasticbeanstalk update-environment \
            --application-name "${EB_APP_NAME}" \
            --environment-name "${EB_ENV_NAME}" \
            --version-label "${{ steps.version.outputs.label }}"

      - name: Wait for environment health (Ready + Green)
        run: |
          VERSION="${{ steps.version.outputs.label }}"
          echo "Waiting for ${EB_ENV_NAME} → Ready/Green on version ${VERSION}..."
          for i in $(seq 1 40); do
            read -r STATUS HEALTH HEALTH_STATUS VERSION_LABEL <<< "$(
              aws elasticbeanstalk describe-environments \
                --application-name "${EB_APP_NAME}" \
                --environment-names "${EB_ENV_NAME}" \
                --query 'Environments[0].[Status,Health,HealthStatus,VersionLabel]' \
                --output text
            )"
            echo "Attempt ${i}: Status=${STATUS} Health=${HEALTH} HealthStatus=${HEALTH_STATUS} Version=${VERSION_LABEL}"
            if [ "${STATUS}" = "Ready" ] && { [ "${HEALTH}" = "Green" ] || [ "${HEALTH_STATUS}" = "Ok" ]; }; then
              if [ "${VERSION_LABEL}" = "${VERSION}" ]; then
                echo "Environment is Ready/Green on ${VERSION}."
                exit 0
              fi
              echo "Ready/Green but version is '${VERSION_LABEL}' (expected '${VERSION}'); continuing..."
            fi
            sleep 15
          done
          echo "Environment did not reach Ready/Green within timeout."
          exit 1

      - name: Smoke test API health
        run: |
          echo "GET ${API_HEALTH_URL}"
          BODY="$(curl -fsS --max-time 30 "${API_HEALTH_URL}")"
          echo "Response: ${BODY}"
          echo "${BODY}" | grep -qE '"status"[[:space:]]*:[[:space:]]*"(ok|healthy)"' \
            || { echo "Expected status ok or healthy in response body."; exit 1; }

      - name: Deployment summary
        if: success()
        run: |
          {
            echo "## Deployment successful"
            echo ""
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Version | \`${{ steps.version.outputs.label }}\` |"
            echo "| EB environment | \`${EB_ENV_NAME}\` |"
            echo "| S3 artifact | \`s3://${DEPLOY_BUCKET}/${{ steps.bundle.outputs.bundle_name }}\` |"
            echo "| Health | ${API_HEALTH_URL} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deployment failed — manual fallback
        if: failure()
        run: |
          {
            echo "## Deployment failed"
            echo ""
            echo "Automated deploy did not complete. The **test** job passed; use manual deploy:"
            echo ""
            echo '```powershell'
            echo 'cd anot-backend-main\anot-backend-main'
            echo 'powershell -File scripts\deploy-to-eb.ps1'
            echo '```'
            echo ""
            echo "Then verify:"
            echo ""
            echo '```bash'
            echo './scripts/post-deploy-verification.sh'
            echo '```'
            echo ""
            echo "See [docs/DEPLOYMENT_RUNBOOK.md](docs/DEPLOYMENT_RUNBOOK.md) and [docs/CI_CD_PIPELINE.md](docs/CI_CD_PIPELINE.md)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::Deploy failed — run scripts/deploy-to-eb.ps1 manually. See job summary for steps."

  deploy-frontend:
    name: deploy-frontend
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: anot-frontend-main/anot-frontend-main/package-lock.json

      - name: Verify Node 22
        run: node --version | grep -E '^v22\.'

      - name: Build frontend
        working-directory: anot-frontend-main/anot-frontend-main
        env:
          VITE_API_URL: https://app.anot.health/api
        run: |
          npm ci
          npm run build

      - name: Deployment note
        run: |
          echo "Frontend build succeeded. Upload dist/ to S3/CloudFront or connect Vercel for static hosting."
