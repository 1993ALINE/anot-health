name: Security Scan

on:
  schedule:
    - cron: '0 6 * * 1'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  npm-audit:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        project: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          check-latest: true
          cache: 'npm'
          cache-dependency-path: |
            anot-backend-main/package-lock.json
            anot-frontend-main/anot-frontend-main/package-lock.json
      - name: Verify Node version
        run: node --version && npm --version
      - name: Backend audit
        if: matrix.project == 'backend'
        working-directory: anot-backend-main
        run: |
          npm ci
          npm audit --audit-level=high
      - name: Frontend audit
        if: matrix.project == 'frontend'
        working-directory: anot-frontend-main/anot-frontend-main
        run: |
          npm ci
          npm audit --audit-level=high

  secret-scan:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
